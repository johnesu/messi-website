version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: mesi-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: mesi
      POSTGRES_PASSWORD: mesi
      POSTGRES_DB: mesi
    ports:
      - "5432:5432"
    volumes:
      - mesi-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mesi -d mesi"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: mesi-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - mesi-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: mesi-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - mesi-minio:/data

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until (mc alias set local http://minio:9000 minioadmin minioadmin) do sleep 3; done;
      mc mb --ignore-existing local/mesi;
      exit 0;
      "

volumes:
  mesi-postgres:
  mesi-redis:
  mesi-minio:
